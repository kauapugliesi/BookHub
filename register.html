<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/register-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>BookHub</title>
</head>
<body>
    <h1 id="title">BookHub</h1>
    <h3 id="sub-title">Crie sua conta</h3>
    <p id="caption">Junte-se à nossa comunidade de leitores</p>
    <div id="container">
        <form id="register-form" action="login.html" method="post">
        <label for="name" class="form-box">Nome Completo:
            <input type="text" id="name" name="name" placeholder="(mín 3 letras)" required>
        </label>

        <label for="usuario" class="form-box">Usuário:
            <input type="text" id="usuario" name="usuario" placeholder="JoaoSilva" required>
        </label>

        <label for="email" class="form-box">E-mail:
            <input type="text" id="email" name="email" placeholder="exemplo@email.com" required>
        </label>

        <label for="password" class="form-box">Senha:
            <input type="password" id="password" name="password" placeholder="(Mín 8 caracteres, 1 maiúscula, 1 número)" required>
        </label>

        <button id="register-button" type="submit" >Cadastrar</button>
    </form>

        <p id="result-message"></p>

        <a href="login.html" id="login">Já tem uma conta? Fazer login</a>
    </div>

    <a href="index.html" id="back">← Voltar para a página inicial</a>

    <script src="js/register-script.js" ></script>
    
</body>
</html>
