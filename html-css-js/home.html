<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/home-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    

    <title>BookHub</title>
</head>
<body>

    <aside class="side-bar">
        <h3 id="side-title">BookHub</h3>
        <p id="side-subtitle">Sua biblioteca pessoal</p>
        <nav>
            <ul>
                <a href=""><li class="button" id="home-button"><i class="fa-regular fa-house" ></i> Home</li></a>
                <a href="favoritos.html"><li class="button" id="favorite"><i class="fa-regular fa-heart"></i> Favoritos</li></a>
                <a href="avaliacoes.html"><li class="button" id="avaliation"><i class="fa-solid fa-feather"></i>Avaliações</li></a>
                <a href="biblioteca.html"><li class="button" id="books"><i class="fa-brands fa-readme"></i>Biblioteca</li></a>
                <a href="bookList.html"><li class="button" id="lists"><i class="fa-regular fa-bookmark"></i>Book List</li></a>
            </ul>
        </nav>
        <div id="exit" >
            <a href="index.html">
                <p class="button"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sair</p>
            </a>
        </div>    
    </aside>
    <main>
        <h1 id="main-title">Olá, Usuário exemplo</h1>
        <p id="main-sub-title">Navegue pelas leituras</p>

        <form action="" method="get">
            <label class="search-box">
            <i class="fa-brands fa-sistrix"></i>   
            <input type="text" name="search" placeholder="Buscar livros ou autores...">
            </label>
        </form>

        <h4 id="results-title">Todos os livros</h4>
        <p id="results-subtitle">Carregando livros...</p>

        
        <div class="carousel-container">
            <h4 class="section-title">Mais Lidos</h4>   
            <div class="section-divider"></div>
            <div class="carousel-window">
                <button class="carousel-btn prev" onclick="moveCarousel('mais-famosos', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="mais-famosos" class="carousel-track">
                    <!-- Livros inseridos via JS -->
                </div>
                <button class="carousel-btn next" onclick="moveCarousel('mais-famosos', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        
        <div class="carousel-container">
            <h4 class="section-title">Top da semana</h4>
            <div class="section-divider"></div>
            <div class="carousel-window">
                <button class="carousel-btn prev" onclick="moveCarousel('top-semana', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="top-semana" class="carousel-track">
                    <!-- Livros inseridos via JS -->
                </div>
                <button class="carousel-btn next" onclick="moveCarousel('top-semana', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        
        <div class="carousel-container">
            <h4 class="section-title">Com base nas suas leituras</h4>
            <div class="section-divider"></div>
            <div class="carousel-window">
                <button class="carousel-btn prev" onclick="moveCarousel('genero-comum', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="genero-comum" class="carousel-track" >
                    
                </div>
                <button class="carousel-btn next" onclick="moveCarousel('genero-comum', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>


    </main>
    <footer></footer>
    
    <script src="js/script.js"></script>  
</body>
</html>
